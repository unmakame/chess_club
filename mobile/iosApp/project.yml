name: bbchess
options:
  deploymentTarget:
    iOS: "15.0"
targets:
  bbchess:
    type: application
    platform: iOS
    sources:
      - BBChessApp.swift
      - Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.unmakame.bbchess
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: bbchess
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        FRAMEWORK_SEARCH_PATHS: '$(inherited) "$(SRCROOT)/../app/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"'
        OTHER_LDFLAGS: "$(inherited) -framework Bbchess"
    preBuildScripts:
      - name: Compile Kotlin framework
        script: |
          cd "$SRCROOT/.."
          ./gradlew :app:embedAndSignAppleFrameworkForXcode
        basedOnDependencyAnalysis: false
